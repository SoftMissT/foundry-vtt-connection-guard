name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Empacotar módulo
        run: npm run package

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.zip
            dist/module.json
          generate_release_notes: true
